name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: node_modules/.bin/vitest run

      # No database URLs here on purpose. There is no Postgres on the runner, so a placeholder
      # localhost URL does not stand in for one: it only gets scripts/migrate.ts far enough to try
      # connecting, and the build then dies on CREATE SCHEMA. Left unset, the migration skips the way
      # it is written to and next build prerenders every page without touching either database.
      - name: Build
        run: pnpm build
