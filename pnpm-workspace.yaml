# esbuild and sharp compile a native binary in a postinstall script. pnpm 11 refuses to run those
# scripts unless they are named here, and then fails the install outright rather than warning, so an
# unanswered entry is a broken build rather than a slow one. This file was committed with its
# placeholder text still in place, which is what took production down.
allowBuilds:
  esbuild: true
  sharp: true
